<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit company details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
input::placeholder{color:#5D6D80}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">

<div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px">
<a href="W-You.dc.html" aria-label="Back" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1A2B"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Company details</h1>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 14px 20px 0">
<div style="display: flex; align-items: center; gap: 14px">
<dc-import name="WAvatar" who="airbus1" size="64" hint-size="64px,64px"></dc-import>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Change logo</button>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Company name
<input type="text" value="Airbus1" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B">
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 800">Company type</span>
<button type="button" aria-label="Company type: MRO. Change" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; font-family: inherit; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer"><span style="flex: 1 1 auto">MRO</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 800">Country</span>
<button type="button" aria-label="Country: Belgium. Change" style="display: flex; align-items: center; height: 50px; padding: 0 12px; border-radius: 14px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; font-family: inherit; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer"><span style="flex: 1 1 auto">Belgium</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">City
<input type="text" value="Liège" style="height: 50px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B">
</label>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 800">Contact email</span>
<span style="display: flex; align-items: center; height: 50px; padding: 0 14px; border-radius: 14px; background: #F3F6F9; font-size: 15px; color: #526274">josecuentaparaia1@gmail.com</span>
<span style="font-size: 12.5px; color: #66768A">This email cannot be changed from the company profile.</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Phone <span style="font-weight: 600; color: #66768A; margin-top: -6px">Optional</span>
<input type="tel" placeholder="+32 4 00 00 00 00" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B">
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Website
<input type="url" value="https://avsmartech.com" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B">
<span style="font-size: 12.5px; font-weight: 600; color: #66768A">Optional. Shown to technicians on your offers — it is public, not gated by acceptance.</span>
</label>
</div>

<div style="flex: none; padding: 12px 20px 22px; border-top: 1px solid #E6ECF1; background: #FFFFFF">
<a href="W-You.dc.html" style="height: 52px; border-radius: 26px; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">Save</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#0B6A9E' };
  }
}
</script>
</body>
</html>
