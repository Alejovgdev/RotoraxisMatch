<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add type rating · Step 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
input::placeholder{color:#5D6D80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">
<div style="flex: none">
<dc-import name="TStepHeader" flow="Add type rating" step="2" total="2" back="T-Rat.dc.html" primary="{{primary}}" hint-size="390px,76px"></dc-import>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 18px 20px 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2">A few details</h1>
<p style="margin: 0; font-size: 14.5px; line-height: 1.45; color: #526274">Only the status is needed. The rest is optional.</p>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #E6F1F8">
<span style="flex: none; width: 44px; height: 44px; border-radius: 13px; background: #FFFFFF; color: #0B5E8C; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800">Airbus A320neo family — CFM LEAP-1A</span><span style="font-size: 13px; color: #2E4C66">On your EASA B1.1</span></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 800">Status</span>
<div role="radiogroup" aria-label="Status" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #EEF3F7">
<sc-for list="{{ statuses }}" as="c" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{ c.pick }}" style="height: 46px; border-radius: 12px; border: 0; background: {{c.bg}}; box-shadow: {{c.shadow}}; color: {{c.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 800">Issued
<input type="date" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B; background: #FFFFFF">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 800">Expires
<input type="date" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15px; color: #0E1A2B; background: #FFFFFF">
</label>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Years on this rating
<input type="number" min="0" inputmode="numeric" placeholder="e.g. 4" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #D5DEE6; font-family: inherit; font-size: 15.5px; color: #0E1A2B">
</label>
</div>

<div style="flex: none; padding: 12px 20px 22px; border-top: 1px solid #E6ECF1; background: #FFFFFF">
<a href="T-Done.dc.html" style="height: 52px; border-radius: 26px; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">Add type rating</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = (this.state && this.state.status) || 'current';
    const statuses = [['current', 'Current'], ['old', 'Not current']].map((c) => {
      const on = c[0] === cur;
      return {
        label: c[1], checked: on ? 'true' : 'false',
        bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0E1A2B' : '#526274',
        shadow: on ? '0 1px 3px rgba(14, 26, 43, 0.14)' : 'none',
        pick: () => this.setState({ status: c[0] })
      };
    });
    return { primary: this.props.primary ?? '#0B6A9E', statuses: statuses };
  }
}
</script>
</body>
</html>
