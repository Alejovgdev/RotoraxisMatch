<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post offer header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 76px; box-sizing: border-box; padding: 8px 20px 0 4px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<sc-if value="{{ isFirst }}" hint-placeholder-val="{{ true }}">
<a href="W-Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1A2B">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
</a>
</sc-if>
<sc-if value="{{ notFirst }}" hint-placeholder-val="{{ false }}">
<a href="{{back}}" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1A2B">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
</sc-if>
<span style="font-size: 14px; font-weight: 700; color: #526274">{{label}}</span>
</div>
<div style="display: flex; gap: 6px; padding-left: 16px">
<sc-for list="{{ segs }}" as="s" hint-placeholder-count="4">
<span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: {{s.bg}}"></span>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":1,"min":1,"max":5},"back":{"editor":"text","default":"W-Post.dc.html"},"primary":{"editor":"color","default":"#0B6A9E"},"$preview":{"width":390,"height":76},"total":{"editor":"int","default":4,"min":1,"max":6}}'>
class Component extends DCLogic {
  renderVals() {
    const n = parseInt(this.props.step ?? 1, 10) || 1;
    const p = this.props.primary ?? '#0B6A9E';
    const total = parseInt(this.props.total ?? 4, 10) || 4;
    const segs = [];
    for (let i = 1; i <= total; i++) segs.push({ bg: i <= n ? p : '#E3E9EF' });
    return {
      segs: segs,
      isFirst: n === 1,
      notFirst: n !== 1,
      back: this.props.back ?? 'W-Post.dc.html',
      label: n <= total ? 'Step ' + n + ' of ' + total : 'Review',
    };
  }
}
</script>
</body>
</html>
