<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technician · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">
<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 16px 20px 0; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Nunito', 'Nunito Sans', sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.2px; color: #0E8FB0">Aviation Job Talent</span>
<button type="button" aria-label="Notifications" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: transparent; color: #0E1A2B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
</button>
</div>

<a href="T-Search.dc.html" style="margin-top: -6px; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px; border-radius: 25px; background: #EEF3F7; color: #526274; text-decoration: none; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span>Search offers, aircraft, places</span>
</a>

<a href="T-Offer.dc.html" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #E6F1F8; text-decoration: none; color: #0E1A2B">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 12.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #2E4C66">Best match for you</span>
<span style="height: 28px; padding: 0 11px; border-radius: 14px; background: #FFFFFF; color: #157F4F; display: flex; align-items: center; font-size: 13.5px; font-weight: 800">95% match</span>
</span>
<span style="display: flex; align-items: center; gap: 12px">
<dc-import name="WAvatar" who="airbus1" size="52" hint-size="52px,52px"></dc-import>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 800">B1.1 UK CAA offer</span>
<span style="font-size: 13.5px; color: #2E4C66">Airbus1 · Manchester, UK · Permanent</span>
</span>
</span>
<span style="height: 44px; border-radius: 22px; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">View offer</span>
</a>

<nav aria-label="Shortcuts" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="position: relative; width: 58px; height: 58px; border-radius: 29px; background: #FDE7B5; color: #8A4A0C; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
<span style="position: absolute; top: -3px; right: -3px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; background: #D42C2C; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">1</span>
</span>
<span>Applications</span>
</a>
<a href="T-Direct.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 58px; height: 58px; border-radius: 29px; background: #D6ECF8; color: #0B5E8C; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
</span>
<span>Direct offers</span>
</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 58px; height: 58px; border-radius: 29px; background: #D5F2E4; color: #0B6B45; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
</span>
<span>Map</span>
</a>
<a href="T-Docs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 58px; height: 58px; border-radius: 29px; background: #E3E8EE; color: #33465A; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="m9 15 2 2 4-4"></path></svg>
</span>
<span>Documents</span>
</a>
</nav>

<section style="display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 2px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Offers for you</h2>
<a href="T-Search.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; color: {{primary}}">See all</a>
</div>
<sc-for list="{{ offers }}" as="o" hint-placeholder-count="3">
<a href="{{o.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: {{o.border}}; text-decoration: none; color: #0E1A2B">
<dc-import name="WAvatar" who="{{o.logo}}" size="52" hint-size="52px,52px"></dc-import>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.title}}</span>
<span style="font-size: 13px; color: #526274; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.meta}}</span>
</span>
<span style="flex: none; font-size: 17px; font-weight: 800; color: #157F4F">{{o.match}}</span>
</a>
</sc-for>
</section>
</div>

<div style="flex: none">
<dc-import name="TTabBar" active="home" primary="{{primary}}" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const o = (logo, title, meta, match, href, last) => ({ logo, title, meta, match, href, border: last ? 'none' : '1px solid #E6ECF1' });
    return {
      primary: this.props.primary ?? '#0B6A9E',
      offers: [
        o('northwing', 'B1 Mechanic · A320 family', 'Northwing MRO · Dublin, Ireland', '88%', '#', false),
        o('halcon', 'B1.3 Technician · H145', 'Halcón Aero · Madrid, Spain', '74%', '#', false),
        o('skybase', 'B1.1 Line Technician · A330', 'SkyBase Technics · Lisbon, Portugal', '69%', '#', true)
      ]
    };
  }
}
</script>
</body>
</html>
