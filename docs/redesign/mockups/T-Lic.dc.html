<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add licence · Step 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">
<div style="flex: none">
<dc-import name="TStepHeader" flow="Add licence" step="1" total="2" back="T-Add.dc.html" primary="{{primary}}" hint-size="390px,76px"></dc-import>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 18px 20px 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2">Which licence do you hold?</h1>
<p style="margin: 0; font-size: 14.5px; line-height: 1.45; color: #526274">Pick the authority, then every category it issued you.</p>
</div>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 12.5px; font-weight: 800; letter-spacing: 0.7px; text-transform: uppercase; color: #66768A">Authority</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ auths }}" as="a" hint-placeholder-count="5">
<button type="button" aria-pressed="{{a.pressed}}" onClick="{{ a.pick }}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{a.label}}</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 12.5px; font-weight: 800; letter-spacing: 0.7px; text-transform: uppercase; color: #66768A">Categories · pick all you hold</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="12">
<sc-if value="{{ c.held }}" hint-placeholder-val="{{ false }}">
<a href="T-Quals.dc.html" aria-label="{{c.aria}}" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #A7DCC3; background: #E5F4EC; color: #0B5B3A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-decoration: none; line-height: 1.1">
<span style="display: flex; align-items: center; gap: 3px; font-size: 14.5px; font-weight: 800"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>{{c.label}}</span>
<span style="font-size: 11px; font-weight: 800">Added</span>
</a>
</sc-if>
<sc-if value="{{ c.free }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{ c.toggle }}" style="height: 48px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{c.label}}</button>
</sc-if>
</sc-for>
</div>
<sc-if value="{{ hasAdds }}" hint-placeholder-val="{{ true }}">
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #E6F1F8; color: #0B5E8C; font-size: 14px; font-weight: 800">
<span style="flex: none; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</span>
{{addsNote}}
</div>
</sc-if>
</section>
</div>

<div style="flex: none; padding: 12px 20px 22px; border-top: 1px solid #E6ECF1; background: #FFFFFF">
<a href="{{nextHref}}" aria-disabled="{{nextDisabled}}" style="height: 52px; border-radius: 26px; background: {{nextBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">{{nextLabel}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.primary ?? '#0B6A9E';
    const s = this.state || {};
    const auth = s.auth || 'easa';
    const picked = s.picked || { easa: ['B2'] };
    const part66 = ['A1', 'A2', 'A3', 'A4', 'B1.1', 'B1.2', 'B1.3', 'B1.4', 'B2', 'B2L', 'B3', 'L', 'C'];
    const lists = { easa: part66, ukcaa: part66, casa: part66, gcaa: part66, faa: ['A', 'P', 'A&P'] };
    const held = { easa: ['B1.1', 'B1.3'], faa: ['A&P'] };
    const mine = picked[auth] || [];
    const myHeld = held[auth] || [];
    const auths = [['easa', 'EASA'], ['ukcaa', 'UK CAA'], ['casa', 'CASA'], ['gcaa', 'UAE GCAA'], ['faa', 'FAA']].map((a) => {
      const on = a[0] === auth;
      return {
        label: a[1], pressed: on ? 'true' : 'false',
        bg: on ? '#0E1A2B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1A2B',
        border: on ? '1px solid #0E1A2B' : '1px solid #D5DEE6',
        pick: () => this.setState({ auth: a[0] })
      };
    });
    const cats = lists[auth].map((c) => {
      const isHeld = myHeld.indexOf(c) !== -1;
      const on = mine.indexOf(c) !== -1;
      return {
        label: c, held: isHeld, free: !isHeld, pressed: on ? 'true' : 'false',
        aria: c + ' is already on your profile. Open My work',
        bg: on ? '#E6F1F8' : '#FFFFFF',
        fg: on ? '#0B5E8C' : '#0E1A2B',
        border: on ? '2px solid ' + p : '1px solid #D5DEE6',
        toggle: () => {
          if (isHeld) return;
          const next = Object.assign({}, picked);
          const cur = (next[auth] || []).slice();
          const i = cur.indexOf(c);
          if (i === -1) cur.push(c); else cur.splice(i, 1);
          next[auth] = cur;
          this.setState({ picked: next });
        }
      };
    });
    const n = mine.length;
    const currentTypes = { mechanic: true };
    const typeOf = (code) => (auth === 'faa' ? 'mechanic' : code === 'B2' || code === 'B2L' ? 'avionic' : code === 'C' ? null : 'mechanic');
    const adds = [];
    mine.forEach((code) => { const t = typeOf(code); if (t && !currentTypes[t] && adds.indexOf(t) === -1) adds.push(t); });
    const typeLabels = { mechanic: 'Mechanic', avionic: 'Avionics Technician' };
    return {
      primary: p, auths: auths, cats: cats, hasHeld: myHeld.length > 0,
      hasAdds: adds.length > 0,
      addsNote: 'Adds ' + adds.map((t) => typeLabels[t]).join(' and ') + ' to what you do',
      nextHref: n ? 'T-LicDates.dc.html' : '#',
      nextDisabled: n ? 'false' : 'true',
      nextBg: n ? p : '#A9B6C3',
      nextLabel: n ? 'Continue with ' + n + (n === 1 ? ' licence' : ' licences') : 'Pick at least one'
    };
  }
}
</script>
</body>
</html>
