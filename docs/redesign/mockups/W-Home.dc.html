<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">
<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 16px 20px 0; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Nunito', 'Nunito Sans', sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.2px; color: #0E8FB0">Aviation Job Talent</span>

</div>

<a href="W-Search.dc.html" style="margin-top: -6px; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px; border-radius: 25px; background: #EEF3F7; color: #526274; text-decoration: none; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span>Search technicians, licences, aircraft</span>
</a>

<div style="display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; border-radius: 18px; background: #FFF6E2; border: 1px solid #F3DDA4">
<span style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: #FDE7B5; color: #8A4A0C; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800">1 new application</span>
<span style="font-size: 13.5px; color: #526274; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">B1 Mechanic · A320 family</span>
</div>
<a href="W-Candidate.dc.html" style="flex: none; height: 44px; padding: 0 18px; border-radius: 22px; background: {{primary}}; color: #FFFFFF; font-size: 14.5px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Review</a>
</div>

<nav aria-label="Shortcuts" style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 8px">
<a href="W-Applications.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="position: relative; width: 60px; height: 60px; border-radius: 30px; background: #FDE7B5; color: #8A4A0C; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
<span style="position: absolute; top: -3px; right: -3px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; background: #D42C2C; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">1</span>
</span>
<span>Applications</span>
</a>
<a href="W-Direct.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #D6ECF8; color: #0B5E8C; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg>
</span>
<span>Direct offers</span>
</a>
<a href="W-Map.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #D5F2E4; color: #0B6B45; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
</span>
<span>Map</span>
</a>
<sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ true }}">
<a href="W-Team.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0E1A2B; font-size: 12.5px; font-weight: 700; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #E3E8EE; color: #33465A; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
</span>
<span>Team</span>
</a>
</sc-if>
</nav>

<section style="display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Your offers <span style="color: #66768A; font-weight: 700">9</span></h2>
<a href="C-Offers.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; color: {{primary}}">See all</a>
</div>
<sc-for list="{{ offers }}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: {{item.border}}; text-decoration: none; color: #0E1A2B">
<span style="flex: none; width: 56px; height: 56px; border-radius: 16px; background: {{item.bg}}; color: {{item.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: {{item.size}}">{{item.code}}</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</span>
<span style="font-size: 13px; color: #526274">{{item.meta}}</span>
</span>
<sc-if value="{{ item.isNew }}" hint-placeholder-val="{{ false }}">
<span style="flex: none; height: 26px; padding: 0 10px; border-radius: 13px; background: #FDE7B5; color: #7A3F06; font-size: 12.5px; font-weight: 800; display: flex; align-items: center">1 new</span>
</sc-if>
<sc-if value="{{ item.notNew }}" hint-placeholder-val="{{ true }}">
<span style="flex: none; font-size: 13px; font-weight: 600; color: #66768A">0 applicants</span>
</sc-if>
</a>
</sc-for>
</section>
</div>

<div style="flex: none">
<dc-import name="WTabBar" active="home" role="{{role}}" primary="{{primary}}" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","recruiter","viewer"],"default":"admin"},"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = '1px solid #E6ECF1';
    const o = (code, size, bg, fg, title, meta, isNew, last) => ({ code, size, bg, fg, title, meta, isNew, notNew: !isNew, border: last ? 'none' : line, href: isNew ? 'W-Offer.dc.html' : '#' });
    const isAdmin = (this.props.role ?? 'admin') === 'admin';
    return {
      primary: this.props.primary ?? '#0B6A9E',
      isAdmin: isAdmin,
      role: this.props.role ?? 'admin',
      cols: isAdmin ? 4 : 3,
      offers: [
        o('B1', '19px', '#D6ECF8', '#0B5E8C', 'B1 Mechanic · A320 family', 'Line maintenance · Spain', true, false),
        o('B2', '19px', '#D5F2E4', '#0B6B45', 'B2 Avionics · ATR 72', 'Base maintenance · Spain', false, false),
        o('ENG', '15px', '#E3E8EE', '#33465A', 'Enginetech · CFM56-5B', 'Engine shop · Spain', false, false),
        o('B1', '19px', '#D6ECF8', '#0B5E8C', 'B1 Mechanic · B737 NG', 'Line maintenance · Spain', false, true)
      ]
    };
  }
}
</script>
</body>
</html>
