<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
input::placeholder{color:#5D6D80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">

<div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 4px; border-bottom: 1px solid #E6ECF1">
<a href="W-Inbox.dc.html" aria-label="Back to inbox" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1A2B">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<span style="flex: none"><dc-import name="WAvatar" who="t1193" size="40" hint-size="40px,40px"></dc-import></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 800">Lucía Moreno</span>
<span style="font-size: 12.5px; color: #526274">EASA B2 · Spain</span>
</span>
<a href="#" style="flex: none; height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 800; text-decoration: none; color: {{primary}}">Profile</a>
</div>

<a href="#" style="flex: none; margin: 10px 16px 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #F3F6F9; text-decoration: none; color: #0E1A2B">
<span style="flex: none; width: 38px; height: 38px; border-radius: 11px; background: #D5F2E4; color: #0B6B45; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px">B2</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 800">B2 Avionics · ATR 72</span>
<span style="font-size: 12.5px; color: #526274">Base maintenance · Spain</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66768A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 12px">
<span style="align-self: center; padding: 6px 12px; border-radius: 12px; background: #F3F6F9; font-size: 12.5px; font-weight: 700; color: #526274">You accepted the application · Monday</span>
<sc-for list="{{ msgs }}" as="m" hint-placeholder-count="3">
<div style="align-self: {{m.align}}; max-width: 78%; display: flex; flex-direction: column; gap: 3px">
<span style="padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; line-height: 1.4">{{m.text}}</span>
<span style="font-size: 11.5px; color: #66768A; text-align: {{m.timeAlign}}">{{m.time}}</span>
</div>
</sc-for>
</div>

<sc-if value="{{ canWrite }}" hint-placeholder-val="{{ true }}">
<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px 22px; border-top: 1px solid #E6ECF1; background: #FFFFFF">
<input type="text" aria-label="Message" placeholder="Write a message" value="{{draft}}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 18px; border: 0; border-radius: 23px; background: #EEF3F7; font-family: inherit; font-size: 15px; color: #0E1A2B; outline: none">
<button type="button" aria-label="Send" onClick="{{ send }}" style="flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 23px; background: {{sendBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg>
</button>
</div>
</sc-if>
<sc-if value="{{ isViewer }}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 16px 26px; border-top: 1px solid #E6ECF1; background: #F7F9FB; font-size: 14px; font-weight: 700; color: #526274"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Viewer role cannot send messages.</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","recruiter","viewer"],"default":"admin"},"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.primary ?? '#0B6A9E';
    const s = this.state || {};
    const base = [
      { who: 'them', text: "Hi! Thanks for accepting. I've worked on the ATR 72-600 for 6 years.", time: 'Mon 09:12' },
      { who: 'me', text: 'Great to hear. Could you start in March?', time: 'Mon 09:40' },
      { who: 'them', text: 'Yes, March works for me.', time: '10:24' }
    ];
    const msgs = base.concat(s.extra || []).map((m) => {
      const me = m.who === 'me';
      return {
        text: m.text, time: m.time,
        align: me ? 'flex-end' : 'flex-start',
        bg: me ? p : '#EEF3F7', fg: me ? '#FFFFFF' : '#0E1A2B',
        radius: me ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
        timeAlign: me ? 'right' : 'left'
      };
    });
    const draft = s.draft || '';
    const send = () => {
      const st = this.state || {};
      const t = (st.draft || '').trim();
      if (!t) return;
      this.setState({ draft: '', extra: (st.extra || []).concat([{ who: 'me', text: t, time: 'Now' }]) });
    };
    return {
      primary: p, msgs: msgs, draft: draft,
      canWrite: (this.props.role ?? 'admin') !== 'viewer', isViewer: (this.props.role ?? 'admin') === 'viewer',
      sendBg: draft.trim() ? p : '#A9B6C3',
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') send(); },
      send: send
    };
  }
}
</script>
</body>
</html>
