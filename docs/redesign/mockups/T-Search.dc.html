<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technician · Offers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6A9E}a:hover{color:#08507A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1A2B; font-family: 'Nunito Sans', system-ui, sans-serif; overflow: hidden">

<div style="flex: none; padding: 12px 16px 6px">
<button type="button" aria-label="Edit search" style="width: 100%; height: 48px; padding: 0 16px; border: 0; border-radius: 24px; background: #EEF3F7; color: #0E1A2B; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#526274" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span>Offers that match you</span>
</button>
</div>

<div style="flex: none; display: flex; gap: 8px; padding: 6px 16px 10px; overflow: hidden">
<button type="button" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
Filters
</button>
<button type="button" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #0E1A2B; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">My licences</button>
<button type="button" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Airplanes</button>
<button type="button" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D5DEE6; background: #FFFFFF; color: #0E1A2B; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Permanent</button>
</div>

<div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
<p style="margin: 0; padding: 2px 16px 10px; font-size: 13.5px; font-weight: 700; color: #526274">Best match first</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 12px">
<sc-for list="{{ offers }}" as="o" hint-placeholder-count="6">
<a href="{{o.href}}" style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid #E6ECF1; background: #FFFFFF; text-decoration: none; color: #0E1A2B">
<span style="position: relative; height: 108px; background: {{o.bg}}; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; top: 10px; left: 10px; height: 26px; padding: 0 9px; border-radius: 13px; background: #FFFFFF; color: #157F4F; font-size: 12.5px; font-weight: 800; display: flex; align-items: center">{{o.match}}</span>
<dc-import name="WAvatar" who="{{o.logo}}" size="56" hint-size="56px,56px"></dc-import>
</span>
<span style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 800; line-height: 1.25">{{o.title}}</span>
<span style="font-size: 12.5px; color: #526274">{{o.place}}</span>
<span style="font-size: 12.5px; font-weight: 700; color: #33465A">{{o.contract}}</span>
</span>
</a>
</sc-for>
</div>
<a href="#" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); height: 46px; padding: 0 20px; border-radius: 23px; background: #0E1A2B; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14.5px; font-weight: 800; box-shadow: 0 8px 20px rgba(14, 26, 43, 0.28)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"></path><path d="M15 5.764v15"></path><path d="M9 3.236v15"></path></svg>
Map
</a>
</div>

<div style="flex: none">
<dc-import name="TTabBar" active="search" primary="{{primary}}" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#0B6A9E","options":["#0B6A9E","#0E8FB0","#13314D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const o = (logo, bg, title, place, contract, match, href) => ({ logo, bg, title, place, contract, match, href });
    return {
      primary: this.props.primary ?? '#0B6A9E',
      offers: [
        o('airbus1', '#E6F1F8', 'B1.1 UK CAA offer', 'Manchester, UK', 'Permanent', '95%', 'T-Offer.dc.html'),
        o('northwing', '#DDF2EF', 'B1 Mechanic · A320 family', 'Dublin, Ireland', 'Long-term', '88%', '#'),
        o('halcon', '#FBE9DF', 'B1.3 Technician · H145', 'Madrid, Spain', 'Permanent', '74%', '#'),
        o('skybase', '#E8E9F5', 'B1.1 Line Technician · A330', 'Lisbon, Portugal', 'Short-term', '69%', '#'),
        o('northwing', '#DDF2EF', 'B1.1 Base Maintenance · A320neo', 'Shannon, Ireland', 'Permanent', '66%', '#'),
        o('halcon', '#FBE9DF', 'Engine Technician · PW1100G', 'Barcelona, Spain', 'Short-term', '61%', '#')
      ]
    };
  }
}
</script>
</body>
</html>
